name: "Thermal Print Bridge"
version: "0.3.1"
slug: "thermalprint"
description: "HTTP bridge for cheap Chinese Bluetooth thermal printers (TiMini Print protocol)"
url: "https://github.com/jn17d/thermalprinter"
arch:
  - amd64
  - aarch64
  - armv7
init: false
host_dbus: true
host_network: true
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:printer
panel_title: "Thermal Printer"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "HTTP API for print requests (also reachable via Ingress in the sidebar)"
options:
  printer_model: ""
  printer_bluetooth: ""
  discord_enabled: false
  discord_bot_token: ""
  discord_channel_id: ""
  discord_allowed_user_ids: ""
schema:
  printer_model: "str?"
  printer_bluetooth: "str?"
  discord_enabled: "bool"
  discord_bot_token: "password"
  discord_channel_id: "str?"
  discord_allowed_user_ids: "str?"
